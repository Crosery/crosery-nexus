# Include from the console virtual host (or the surrounding http block).
# HTML is compressed by nginx automatically; these types cover hashed assets
# and authenticated JSON reports without requiring precompressed build files.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml
  text/css
  text/javascript
  text/plain;
