name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binaries
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          fi
          VERSION="${VERSION#v}"
          echo "Building version: $VERSION"
          chmod +x scripts/build.sh
          ./scripts/build.sh "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: Release ${{ github.ref_name || github.event.inputs.tag }}
          generate_release_notes: true
          files: |
            dist/crapi-darwin-amd64
            dist/crapi-darwin-arm64
            dist/crapi-linux-amd64
            dist/crapi-linux-arm64
            dist/crapi-windows-amd64.exe
            dist/crapi-windows-arm64.exe
            dist/crapi-windows-386.exe
            dist/install.sh
            dist/install.ps1
            dist/install.cmd
            dist/SHA256SUMS
            dist/VERSION
